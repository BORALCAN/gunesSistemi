<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Güneş Sistemi ve Yerçekimi</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #e8ecf6;
        --mut: #8b94ad;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #02030a;
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
      }
      header {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
        pointer-events: none;
        z-index: 3;
      }
      h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
      }
      header p {
        margin: 3px 0 0;
        font-size: 12px;
        color: var(--mut);
      }
      #spd {
        position: fixed;
        right: 16px;
        top: calc(14px + env(safe-area-inset-top, 0px));
        z-index: 4;
        font-size: 12px;
        color: var(--mut);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #spd input {
        width: 90px;
      }
      .lbl {
        position: fixed;
        left: 0;
        top: 0;
        font-size: 12px;
        color: #cfd8f5;
        cursor: pointer;
        z-index: 2;
        text-shadow: 0 0 4px #000;
        padding: 2px 4px;
        white-space: nowrap;
        will-change: transform;
      }
      .lbl:hover {
        color: #fff;
      }
      #chips {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        z-index: 4;
        background: linear-gradient(transparent, rgba(2, 3, 10, 0.85));
      }
      #chips button {
        flex: none;
        background: #10162c;
        color: var(--fg);
        border: 1px solid #27325c;
        border-radius: 16px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      #chips button.on {
        background: #2c3f8f;
        border-color: #6f86ff;
      }
      #panel {
        position: fixed;
        right: 14px;
        top: 60px;
        width: 270px;
        max-height: calc(100% - 140px);
        overflow: auto;
        background: rgba(10, 14, 30, 0.88);
        border: 1px solid #27325c;
        border-radius: 14px;
        padding: 14px;
        z-index: 4;
        display: none;
        backdrop-filter: blur(6px);
      }
      #panel h2 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      #panel p {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--mut);
      }
      #panel p b {
        color: #fbbf24;
      }
      .pl {
        font-size: 11px;
        color: var(--mut);
        text-align: center;
        margin: 2px 0;
      }
      .row {
        display: grid;
        grid-template-columns: 38px 1fr 54px;
        gap: 8px;
        align-items: center;
        height: 20px;
        font-size: 12px;
        border-radius: 4px;
      }
      .row.hl {
        background: #ffffff1f;
      }
      .row span {
        color: var(--mut);
        text-align: right;
      }
      .row i {
        display: block;
        height: 9px;
        border-radius: 5px;
      }
      .row b {
        text-align: right;
        font-weight: 600;
      }
      #ck {
        display: block;
        margin-top: 10px;
        font-size: 12px;
        color: var(--mut);
      }
      .leg {
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          hsl(215, 85%, 52%),
          hsl(25, 85%, 52%)
        );
        margin: 6px 0 2px;
      }
      .legt {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--mut);
      }
      #ch {
        margin: 12px 0 4px;
        padding: 10px;
        border-radius: 10px;
        background: #ffffff12;
        min-height: 44px;
        font-size: 13px;
        color: var(--mut);
      }
      #ch b {
        display: block;
        font-size: 15px;
        color: var(--fg);
      }
      #ch span {
        font-size: 22px;
        font-weight: 700;
        color: #fbbf24;
      }
      #note {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: var(--mut);
        line-height: 1.4;
      }
      #tip {
        position: fixed;
        pointer-events: none;
        background: #0f1428f2;
        border: 1px solid #2a3558;
        border-radius: 8px;
        padding: 5px 9px;
        font-size: 12px;
        display: none;
        z-index: 6;
        white-space: nowrap;
      }
      #err {
        display: none;
        position: fixed;
        inset: 0;
        padding: 100px 20px;
        text-align: center;
        z-index: 9;
      }
      @media (max-width: 640px) {
        #panel {
          left: 10px;
          right: 10px;
          top: auto;
          bottom: calc(52px + env(safe-area-inset-bottom, 0px));
          width: auto;
          max-height: 42vh;
        }
        header p {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Güneş Sistemi ve Yerçekimi</h1>
      <p>Bir gezegene tıkla · sürükle: döndür · tekerlek: yakınlaş</p>
    </header>
    <div id="spd">
      Hız <input id="sp" type="range" min="0" max="4" step="0.1" value="1" />
    </div>
    <div id="labels"></div>
    <div id="panel">
      <div id="pc"></div>
      <label id="ck"
        ><input type="checkbox" id="chk" checked /> Yerçekimi / sınır katmanını
        göster</label
      ><span id="note"></span>
    </div>
    <div id="chips"></div>
    <div id="tip"></div>
    <div id="err">
      Three.js yüklenemedi. İnternet bağlantını ve reklam engelleyicini kontrol
      et.
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.min.js"></script>
    <script>
      (function () {
        if (!window.THREE || !THREE.OrbitControls) {
          document.getElementById("err").style.display = "block";
          return;
        }
        var N = 13,
          $ = function (i) {
            return document.getElementById(i);
          };
        // ad, yarıçap, yörünge, g ekvator, g kutup (m/s², yaklaşık), eğim, dönüş hızı, taban renk, desen renkleri, gaz devi
        var D = [
          [
            "Güneş",
            7,
            0,
            274,
            274,
            0,
            0.08,
            "#ffb300",
            ["#ff8f00", "#ffd54f", "#ff6d00"],
            0,
          ],
          [
            "Merkür",
            1,
            14,
            3.7,
            3.701,
            0,
            0.05,
            "#8d8d8d",
            ["#6b6b6b", "#a9a9a9", "#555"],
            0,
          ],
          [
            "Venüs",
            1.8,
            20,
            8.87,
            8.871,
            3.09,
            -0.05,
            "#d9b26f",
            ["#c9a063", "#e8c98a", "#b98a4a"],
            0,
          ],
          [
            "Dünya",
            2,
            27,
            9.78,
            9.832,
            0.41,
            0.6,
            "#1b5aa8",
            ["#2f8f3f", "#3d7a2c", "#e9e9e9", "#c2a85a"],
            0,
          ],
          [
            "Mars",
            1.4,
            34,
            3.69,
            3.732,
            0.44,
            0.55,
            "#b5532d",
            ["#8a3a1c", "#d07a4a", "#c9a089"],
            0,
          ],
          [
            "Jüpiter",
            5.5,
            50,
            23.1,
            27.0,
            0.05,
            1.2,
            "#d8b58a",
            ["#b8865a", "#e8d2b0", "#a86a45", "#cfa77a"],
            1,
          ],
          [
            "Satürn",
            4.6,
            68,
            8.96,
            12.1,
            0.47,
            1.1,
            "#e3cf9a",
            ["#d6bd7e", "#f0e2b8", "#c8ab6a"],
            1,
          ],
          [
            "Uranüs",
            3.2,
            83,
            8.69,
            9.21,
            1.7,
            -0.7,
            "#8fd8de",
            ["#7ccdd6", "#a4e4e8", "#9adfe4"],
            1,
          ],
          [
            "Neptün",
            3.1,
            97,
            10.9,
            11.5,
            0.5,
            0.9,
            "#3f63d6",
            ["#2f4fb8", "#5b82ea", "#4a70dd"],
            1,
          ],
        ];

        var K = {
          Güneş: { kind: "sun" },
          Merkür: { kind: "mercury", bs: 2, res: 1024 },
          Venüs: { kind: "venus", atm: "#ffd98a" },
          Dünya: { kind: "earth", atm: "#5aa0ff" },
          Ay: { kind: "moon", bs: 2, res: 1024, par: "Dünya" },
          Mars: { kind: "mars", bs: 1.5, res: 1024, atm: "#ff9a6a" },
          Jüpiter: { kind: "jupiter", atm: "#ffe0b0" },
          Satürn: { kind: "saturn", atm: "#ffeab5" },
          Uranüs: { kind: "uranus", atm: "#7fe8ee" },
          Neptün: { kind: "neptune", atm: "#6a8bff" },
        };
        D.splice(4, 0, [
          "Ay",
          0.55,
          4.4,
          1.62,
          1.62,
          0.03,
          0.8,
          "#b0b0b0",
          ["#888", "#ccc"],
          0,
        ]);
        // --- prosedürel doku üretimi (3B gürültü, çarpık/dikişsiz) ---
        function lp(a, b, t) {
          return a + (b - a) * t;
        }
        function h3(x, y, z) {
          var n =
            (Math.imul(x, 374761393) +
              Math.imul(y, 668265263) +
              Math.imul(z, 1274126177)) |
            0;
          n = Math.imul(n ^ (n >>> 13), 1274126177);
          return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
        }
        function vn(x, y, z) {
          var xi = Math.floor(x),
            yi = Math.floor(y),
            zi = Math.floor(z),
            u = x - xi,
            v = y - yi,
            w = z - zi;
          u = u * u * (3 - 2 * u);
          v = v * v * (3 - 2 * v);
          w = w * w * (3 - 2 * w);
          return lp(
            lp(
              lp(h3(xi, yi, zi), h3(xi + 1, yi, zi), u),
              lp(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), u),
              v,
            ),
            lp(
              lp(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), u),
              lp(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), u),
              v,
            ),
            w,
          );
        }
        function fb(x, y, z, o) {
          var s = 0,
            a = 0.5,
            n = 0;
          for (var i = 0; i < o; i++) {
            s += a * vn(x, y, z);
            n += a;
            x *= 2.03;
            y *= 2.03;
            z *= 2.03;
            a *= 0.5;
          }
          return s / n;
        }
        function mix(a, b, t) {
          return [
            a[0] + (b[0] - a[0]) * t,
            a[1] + (b[1] - a[1]) * t,
            a[2] + (b[2] - a[2]) * t,
          ];
        }
        function hx(s) {
          return [
            parseInt(s.substr(1, 2), 16),
            parseInt(s.substr(3, 2), 16),
            parseInt(s.substr(5, 2), 16),
          ];
        }
        function ramp(st, t) {
          t = Math.max(0, Math.min(0.9999, t));
          var k = t * (st.length - 1),
            i = k | 0;
          return mix(st[i], st[i + 1], k - i);
        }
        var R = {
          mercury: ["#4f4b47", "#8c8782", "#bdb8b1"],
          moon: ["#5f5f5f", "#9a9a9a", "#d0d0d0"],
          mars: ["#4a2216", "#9c4a2a", "#d08c58", "#ecd0a8"],
          jupiter: ["#74492f", "#b5845a", "#e6d3b3", "#f6ecd8"],
          saturn: ["#a98f55", "#d5bf84", "#f2e6c0"],
          uranus: ["#6fbcc4", "#a2dfe4", "#c8f2f4"],
          neptune: ["#1b3596", "#3a62d4", "#6c96f2"],
          venus: ["#a8813f", "#d6ba78", "#f2e6b8"],
          sun: ["#b84000", "#ff8a00", "#ffd23a", "#fff4b8"],
          earth: ["#2b6f2f", "#7d8c46", "#c9b980"],
        };
        for (var kk in R) R[kk] = R[kk].map(hx);
        function ptex(kind, w) {
          var h = w / 2,
            cm = document.createElement("canvas"),
            cb = document.createElement("canvas");
          cm.width = cb.width = w;
          cm.height = cb.height = h;
          var xm = cm.getContext("2d"),
            xb = cb.getContext("2d"),
            im = xm.createImageData(w, h),
            ib = xb.createImageData(w, h),
            d = im.data,
            e = ib.data;
          for (var y = 0; y < h; y++) {
            var lat = (0.5 - (y + 0.5) / h) * Math.PI,
              cy = Math.cos(lat),
              py = Math.sin(lat);
            for (var x = 0; x < w; x++) {
              var lon = ((x + 0.5) / w) * 6.28319,
                px = cy * Math.cos(lon),
                pz = cy * Math.sin(lon),
                c,
                b = 0.5,
                t;
              switch (kind) {
                case "mercury":
                case "moon": {
                  var f = fb(px * 5, py * 5, pz * 5, 5),
                    g = fb(px * 1.6 + 9, py * 1.6, pz * 1.6, 3);
                  t = f * 0.65 + g * 0.35;
                  if (kind === "moon" && g < 0.45)
                    t *= 0.55 + (0.45 * g) / 0.45;
                  c = ramp(R[kind], t * 1.15 - 0.05);
                  b = f;
                  break;
                }
                case "mars": {
                  t = fb(px * 3, py * 3, pz * 3, 5);
                  var dk = fb(px * 1.8 + 5, py * 1.8, pz * 1.8, 3);
                  c = ramp(R.mars, t * 0.95 + 0.12 * (1 - dk) - 0.05);
                  if (dk > 0.56)
                    c = mix(c, [58, 28, 20], Math.min(0.75, (dk - 0.56) * 4));
                  if (
                    Math.abs(py) >
                    0.93 - 0.05 * fb(px * 6, py * 6, pz * 6, 3)
                  )
                    c = mix(c, [246, 246, 250], 0.9);
                  b = t;
                  break;
                }
                case "jupiter": {
                  var yy = py + (fb(px * 5, py * 14, pz * 5, 4) - 0.5) * 0.2,
                    bd =
                      0.5 +
                      0.5 *
                        (Math.sin(yy * 17) * 0.6 + Math.sin(yy * 41 + 1) * 0.4);
                  t =
                    bd * 0.78 +
                    (fb(px * 10, py * 30, pz * 10, 3) - 0.5) * 0.3 +
                    0.1;
                  c = ramp(R.jupiter, t);
                  var dl = Math.atan2(Math.sin(lon - 4.2), Math.cos(lon - 4.2)),
                    dq =
                      (dl / 0.2) * (dl / 0.2) +
                      ((lat + 0.38) / 0.09) * ((lat + 0.38) / 0.09);
                  if (dq < 1.8) c = mix(c, [181, 83, 45], (1 - dq / 1.8) * 0.9);
                  break;
                }
                case "saturn": {
                  var ys = py + (fb(px * 4, py * 12, pz * 4, 3) - 0.5) * 0.05,
                    sb =
                      0.5 +
                      0.5 * (Math.sin(ys * 22) * 0.5 + Math.sin(ys * 53) * 0.5);
                  t =
                    0.25 +
                    sb * 0.5 +
                    (fb(px * 8, py * 30, pz * 8, 3) - 0.5) * 0.2;
                  c = ramp(R.saturn, t);
                  break;
                }
                case "uranus": {
                  t =
                    0.45 +
                    Math.sin(py * 14) * 0.08 +
                    (fb(px * 4, py * 8, pz * 4, 3) - 0.5) * 0.15 +
                    0.25 * Math.pow(Math.abs(py), 3);
                  c = ramp(R.uranus, t);
                  break;
                }
                case "neptune": {
                  t =
                    0.35 +
                    0.2 *
                      Math.sin(py * 10 + fb(px * 3, py * 3, pz * 3, 3) * 3) +
                    (fb(px * 6, py * 14, pz * 6, 4) - 0.5) * 0.4;
                  c = ramp(R.neptune, t);
                  var sk = fb(px * 7, py * 20, pz * 7, 3);
                  if (sk > 0.62)
                    c = mix(c, [235, 240, 255], Math.min(0.8, (sk - 0.62) * 3));
                  var dn = Math.atan2(Math.sin(lon - 2), Math.cos(lon - 2)),
                    dd =
                      (dn / 0.22) * (dn / 0.22) +
                      ((lat + 0.3) / 0.1) * ((lat + 0.3) / 0.1);
                  if (dd < 1.5) c = mix(c, [18, 32, 88], (1 - dd / 1.5) * 0.8);
                  break;
                }
                case "venus": {
                  var tw = fb(px * 2.5, py * 2.5, pz * 2.5, 4);
                  t = fb(px * 3 + tw * 2, py * 6 + tw * 2, pz * 3, 4);
                  c = ramp(R.venus, t * 1.3 - 0.15);
                  break;
                }
                case "sun": {
                  t = fb(px * 18, py * 18, pz * 18, 4);
                  var spn = fb(px * 3 + 2, py * 3, pz * 3, 3);
                  c = ramp(R.sun, t * 1.15 - 0.05);
                  if (spn > 0.64)
                    c = mix(c, [90, 25, 0], Math.min(0.9, (spn - 0.64) * 5));
                  break;
                }
                default: {
                  t = fb(px * 2.2, py * 2.2, pz * 2.2, 5);
                  c = t > 0.5 ? ramp(R.earth, (t - 0.5) * 3) : [27, 90, 168];
                }
              }
              var i = (y * w + x) * 4;
              d[i] = c[0];
              d[i + 1] = c[1];
              d[i + 2] = c[2];
              d[i + 3] = 255;
              e[i] = e[i + 1] = e[i + 2] = b * 255;
              e[i + 3] = 255;
            }
          }
          xm.putImageData(im, 0, 0);
          xb.putImageData(ib, 0, 0);
          if (kind === "mercury" || kind === "moon") {
            for (var n = 0; n < 220; n++) {
              var la = (Math.random() - 0.5) * 2.4,
                cx = Math.random() * w,
                cyy = (0.5 - la / Math.PI) * h,
                r = (Math.pow(Math.random(), 3) * 0.04 + 0.004) * w,
                rx = r / Math.max(0.25, Math.cos(la));
              xm.fillStyle = "rgba(0,0,0,.16)";
              xm.strokeStyle = "rgba(255,255,255,.2)";
              xm.lineWidth = Math.max(1, r * 0.15);
              xm.beginPath();
              xm.ellipse(cx, cyy, rx, r, 0, 0, 6.2832);
              xm.fill();
              xm.stroke();
              xb.fillStyle = "rgba(0,0,0,.5)";
              xb.strokeStyle = "rgba(255,255,255,.6)";
              xb.lineWidth = Math.max(1, r * 0.2);
              xb.beginPath();
              xb.ellipse(cx, cyy, rx, r, 0, 0, 6.2832);
              xb.fill();
              xb.stroke();
            }
          }
          var tm = new THREE.CanvasTexture(cm);
          tm.anisotropy = 8;
          return { map: tm, bump: new THREE.CanvasTexture(cb) };
        }
        function cloudTex() {
          var w = 512,
            h = 256,
            c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          var x = c.getContext("2d"),
            im = x.createImageData(w, h),
            d = im.data;
          for (var y = 0; y < h; y++) {
            var lat = (0.5 - (y + 0.5) / h) * Math.PI,
              cy = Math.cos(lat),
              py = Math.sin(lat);
            for (var u = 0; u < w; u++) {
              var lon = ((u + 0.5) / w) * 6.28319,
                n = fb(
                  cy * Math.cos(lon) * 3,
                  py * 3,
                  cy * Math.sin(lon) * 3,
                  5,
                ),
                k = (y * w + u) * 4;
              d[k] = d[k + 1] = d[k + 2] = 255;
              d[k + 3] = Math.max(0, Math.min(255, (n - 0.5) * 900));
            }
          }
          x.putImageData(im, 0, 0);
          return new THREE.CanvasTexture(c);
        }
        function ringTex() {
          var c = document.createElement("canvas");
          c.width = c.height = 512;
          var x = c.getContext("2d");
          for (var r = 136; r < 256; r += 0.8) {
            var t = (r - 136) / 120,
              a =
                t < 0.18
                  ? 0.28
                  : t < 0.5
                    ? 0.88
                    : t < 0.57
                      ? 0.06
                      : t < 0.93
                        ? 0.7
                        : 0;
            a *=

            "<h2>" +
            p.n +
            "</h2><p>Yüzey yerçekimi: <b>" +
            f(p.min) +
            "</b> – <b>" +
            f(p.max) +
            '</b> m/s²</p><div class="pl">↑ Kuzey kutbu</div>';
          for (var i = 0; i < N; i++) {
            var g = bg(p, i),
              lat = 90 - ((i + 0.5) * 180) / N,
              w = p.uni ? 60 : 25 + (75 * (g - p.min)) / (p.max - p.min);
            h +=
              '<div class="row"><span>' +
              (Math.abs(lat) < 0.5
                ? "0°"
                : Math.round(Math.abs(lat)) + "°" + (lat > 0 ? "K" : "G")) +
              '</span><i style="width:' +
              w +
              "%;background:" +
              cl(p, g) +
              '"></i><b>' +
              f(g) +
              "</b></div>";
          }
          h += '<div class="pl">↓ Güney kutbu</div>';
          $("pc").innerHTML = h;
          rows = $("pc").querySelectorAll(".row");
          $("note").textContent =
            (p.n === "Güneş"
              ? "Güneş bir gezegen değil, yıldızdır. "
              : p.n === "Ay"
                ? "Ay, Dünya’nın uydusudur. "
                : "") +
            (p.uni
              ? "Dönme çok yavaş olduğu için enlemler arası fark ihmal edilebilir. "
              : "En düşük değer ekvatorda, en yüksek kutuplarda (dönme ve basıklık etkisi). ") +
            (p.gas
              ? "Gaz devlerinde değerler 1 bar basınç seviyesi içindir. "
              : "") +
            "Değerler yaklaşıktır.";
          $("panel").style.display = "block";
        }
        // fare: tıklama ve enlem üzerine gelme
        var rc = new THREE.Raycaster(),
          mv = new THREE.Vector2(),
          sx = 0,
          sy = 0,
          cv = renderer.domElement;
        function ndc(e) {
          mv.set(
            (e.clientX / innerWidth) * 2 - 1,
            (-e.clientY / innerHeight) * 2 + 1,
          );
          rc.setFromCamera(mv, camera);
        }
        cv.addEventListener("pointerdown", function (e) {
          sx = e.clientX;
          sy = e.clientY;
        });
        cv.addEventListener("pointerup", function (e) {
          if (Math.hypot(e.clientX - sx, e.clientY - sy) > 6) return;
          ndc(e);
          var h = rc.intersectObjects(meshes)[0];
          if (h) focusOn(h.object.userData.p);
        });
        cv.addEventListener("pointermove", function (e) {
          var tip = $("tip");
          if (e.buttons || !focus || !$("chk").checked) {
            tip.style.display = "none";
            return;
          }
          ndc(e);
          var h = rc.intersectObject(focus.over)[0];
          [].forEach.call(rows, function (r) {
            r.classList.remove("hl");
          });
          if (!h) {
            tip.style.display = "none";
            if (focus.earth) $("ch").textContent = EH;
            else if (focus.hb >= 0) {
              focus.hb = -1;
              bands(focus, -1);
            }
            return;
          }
          if (focus.earth) {
            var c = country(h.uv.x, h.uv.y);
            if (!c) {
              tip.style.display = "none";
              $("ch").textContent = EH;
              return;
            }
            tip.textContent = c.tr + " · " + f(c.g) + " m/s²";
            $("ch").innerHTML =
              "<b>" + c.tr + "</b><span>" + f(c.g) + "</span> m/s²";
            tip.style.left = Math.min(e.clientX + 14, innerWidth - 200) + "px";
            tip.style.top = e.clientY + 14 + "px";
            tip.style.display = "block";
            return;
          }
          var i = Math.min(N - 1, Math.floor((1 - h.uv.y) * N)),
            lat = 90 - ((i + 0.5) * 180) / N;
          if (rows[i]) rows[i].classList.add("hl");
          if (focus.hb !== i) {
            focus.hb = i;
            bands(focus, i);
          }
          tip.textContent =
            (Math.abs(lat) < 0.5
              ? "Ekvator"
              : Math.round(Math.abs(lat)) +
                "° " +
                (lat > 0 ? "kuzey" : "güney")) +
            " · " +
            f(bg(focus, i)) +
            " m/s²";
          tip.style.left = Math.min(e.clientX + 14, innerWidth - 170) + "px";
          tip.style.top = e.clientY + 14 + "px";
          tip.style.display = "block";
        });
        $("sp").oninput = function () {
          spd = +this.value;
        };
        addEventListener("resize", function () {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });

        var clock = new THREE.Clock(),
          nextS = 1,
          tmp = new THREE.Vector3(),
          wp = new THREE.Vector3(),
          off = new THREE.Vector3();
        (function loop() {
          requestAnimationFrame(loop);
          var dt = Math.min(clock.getDelta(), 0.1),
            t = clock.elapsedTime,
            k = Math.min(1, dt * 4);
          P.forEach(function (p) {
            if (p.d) {
              p.ang += p.sp * dt * spd;
              p.pivot.position.set(
                Math.cos(p.ang) * p.d,
                0,
                Math.sin(p.ang) * p.d,
              );
            }
            p.sg.rotation.y +=
              p.spin * dt * spd * (p.earth && focus === p ? 0 : 1);
            if (p.cl) {
              p.cl.rotation.y += 0.02 * dt * spd;
              p.cl.material.opacity +=
                ((focus === p ? 0.12 : 0.55) - p.cl.material.opacity) *
                Math.min(1, dt * 3);
            }
            p.tg.rotation.z +=
              ((focus === p ? 0 : p.tilt) - p.tg.rotation.z) * k;
            p.om.opacity +=
              ((focus === p && fly <= 0 && $("chk").checked ? 1 : 0) -
                p.om.opacity) *
              Math.min(1, dt * 3);
          });
          if (focus) {
            scene.updateMatrixWorld();
            var tp = focus.pivot.getWorldPosition(wp);
            if (fly > 0) {
              fly -= dt;
              off.copy(camera.position).sub(controls.target);
              var len = off.length();
              len += (focus.r * 4.2 - len) * Math.min(1, dt * 3.5);
              controls.target.lerp(tp, Math.min(1, dt * 7));
              camera.position
                .copy(controls.target)
                .addScaledVector(off.normalize(), len);
            } else {
              tmp.copy(tp).sub(controls.target);
              controls.target.add(tmp);
              camera.position.add(tmp);
            }
          } else if (ret > 0) {
            ret -= dt;
            controls.target.lerp(new THREE.Vector3(), Math.min(1, dt * 3));
            camera.position.lerp(home, Math.min(1, dt * 2.5));
          }
          controls.update();
          st1.rotation.y = t * 0.004;
          st2.rotation.y = t * 0.004;
          st2.material.opacity = 0.65 + 0.25 * Math.sin(t * 2.3);
          nextS -= dt;
          if (nextS < 0) {
            spawn();
            nextS = 0.8 + Math.random() * 2.2;
          }
          shoot.forEach(function (s) {
            if (!s.ln.visible) return;
            s.life += dt;
            if (s.life > s.max) {
              s.ln.visible = false;
              return;
            }
            s.h.addScaledVector(s.v, dt);
            var a = s.ln.geometry.attributes.position;
            a.setXYZ(0, s.h.x, s.h.y, s.h.z);
            tmp.copy(s.v).normalize().multiplyScalar(-36).add(s.h);
            a.setXYZ(1, tmp.x, tmp.y, tmp.z);
            a.needsUpdate = true;
            s.ln.material.opacity = Math.sin((Math.PI * s.life) / s.max);
          });
          P.forEach(function (p) {
            p.pivot.getWorldPosition(tmp);
            tmp.y += p.r * (p.n === "Satürn" ? 1.9 : 1.25) + 0.8;
            tmp.project(camera);
            if (tmp.z > 1 || p === focus) {
              p.lbl.style.display = "none";
              return;
            }
            p.lbl.style.display = "block";
            p.lbl.style.transform =
              "translate(" +
              (tmp.x * 0.5 + 0.5) * innerWidth +
              "px," +
              (-tmp.y * 0.5 + 0.5) * innerHeight +
              "px) translate(-50%,-100%)";
          });
          renderer.render(scene, camera);
        })();
      })();
    </script>
  </body>
</html>
